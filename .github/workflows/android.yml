name: Android

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build app, device tests, and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - name: Lint after generated sources are stable
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Verify SQLite migration structure and preserved content
        run: python3 tools/check_migrations.py
